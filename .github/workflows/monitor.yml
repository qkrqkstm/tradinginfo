name: catalyst-monitor

on:
  schedule:
    # GitHub cron 최소 단위는 5분. 잡 내부에서 30초 루프를 돌려 실질 주기를 맞춘다.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        options: [normal, bootstrap, dry-run]
        default: normal

concurrency:
  group: catalyst-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: 저장소 구조 확인
        run: |
          missing=0
          for f in scripts/catalyst_monitor.py scripts/requirements.txt config.json \
                   docs/data/alerts.json state/seen.json; do
            if [ -f "$f" ]; then
              echo "  OK   $f"
            else
              echo "  MISS $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "--- 저장소 루트 실제 내용 ---"
            ls -la
            echo "--- 추적 중인 파일 (상위 40개) ---"
            git ls-files | head -40
            echo "::error::필수 파일 경로가 맞지 않습니다. 저장소 루트에 scripts/ docs/ state/ 가 바로 있어야 합니다."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 캐시 키 계산 (주 단위)
        id: cachekey
        run: echo "key=sec-tickers-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: 티커 매핑 캐시
        uses: actions/cache@v5
        with:
          path: .cache
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: sec-tickers-

      - name: 촉매제 모니터 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          case "${{ inputs.mode }}" in
            bootstrap) ARGS="--bootstrap" ;;
            dry-run)   ARGS="--dry-run --loop --interval 30 --max-runtime 90" ;;
            *)         ARGS="--loop --interval 30 --max-runtime 250" ;;
          esac
          echo "실행 인자: $ARGS"
          python scripts/catalyst_monitor.py $ARGS

      - name: 결과 커밋
        run: |
          git config user.name  "catalyst-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/alerts.json state/seen.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 촉매제 피드 갱신 $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
              echo "푸시 완료"
              exit 0
            fi
            echo "푸시 재시도 $i"
            sleep $((i * 5))
          done
          echo "::error::푸시 실패"
          exit 1
